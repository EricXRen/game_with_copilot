[project]
name = "games"
version = "1.0.0"
description = "A collection of simple games built with Python and Pygame"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Eric Ren", email = "dev@example.com" }
]
dependencies = [
    "pygame>=2.0.0",
    "click",
    "openai>=1.91.0",
    "python-dotenv>=1.1.1",
]

# [tool.uv.workspace]
# members = [
#     "snake3",
# ]



[project.scripts]
tetris = "games.tetris.tetris:main"
snake = "games.snake.snake_game:main"

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-mock>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "W"]

[tool.hatch.build.targets.wheel]
packages = ["src/games"]
